name: Maven tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test
